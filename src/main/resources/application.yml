# =====================================================================
#  Configuracion base - Unidad IV Aplicaciones Web (UTEQ)
#  Los valores sensibles NO se escriben aqui: se inyectan por entorno.
# =====================================================================
spring:
  application:
    name: biblioteca-u4

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/biblioteca}
    username: ${DB_USER:biblioteca}
    password: ${DB_PASSWORD:biblioteca}

  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gestiona Flyway en exclusiva. Nunca cambiar a update ni a create.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  # Timeouts globales de los clientes HTTP sincronos (Spring Boot 4).
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 5s

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    # La Guia PE-U4 admite /api/documentation o /api/docs. Se usa /api/docs.
    path: /api/docs
    operations-sorter: method
    tags-sorter: alpha

app:
  jwt:
    # TODO-U4-2: NO escriba aqui el secreto real. Generelo asi y expórtelo:
    #   openssl rand -base64 48
    secreto: ${JWT_SECRETO:}
    expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:60}
  api-externa:
    base-url: ${API_EXTERNA_URL:https://openlibrary.org}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

logging:
  level:
    root: INFO
    ec.edu.uteq.appweb.biblioteca: DEBUG
    org.hibernate.orm.jdbc.bind: INFO
